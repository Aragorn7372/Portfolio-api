services:

  redis:
    image: redis:7-alpine
    restart: always
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - webnet
  postgres:
    image: postgres:12-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - webnet

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: run
    volumes:
      - ./storage-dir:/app/storage-dir
    restart: always
    env_file: .env
    environment:
      APP_VISITS_JWT_SECRET: ${APP_VISITS_JWT_SECRET}
      APP_VISITS_JWT_MINUTES: ${APP_VISITS_JWT_MINUTES}
      APP_VISITS_TRUSTED_PROXIES: ${APP_VISITS_TRUSTED_PROXIES}
      APP_HOST_ALLOWED: ${APP_HOST_ALLOWED}
    ports:
      - ${API_PORT}:${API_PORT}
    depends_on:
      - postgres
      - redis
    networks:
      - webnet


networks:
  webnet:
    driver: bridge
volumes:
  redis-data:
  postgres-data:
