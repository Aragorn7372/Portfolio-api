spring.application.name=portfolio-api-Test
# 2. Configuraci�n de JPA (Hibernate) para TESTS
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=create-drop
# No llamar a GitHub/APIs externas al levantar el contexto de test
app.refresh-on-startup=false
# Dummies para los @Value de clientes externos (en test no hay env real)
app.certificates.base-url=https://certificates.test.invalid
app.github.base-url=https://api.github.test.invalid
app.github.token=test-token
app.github.personal=test-user
app.github.organizations=
app.visits.jwt-secret=test-secret-de-mas-de-32-caracteres-para-tests
logging.level.org.springframework.mail=DEBUG