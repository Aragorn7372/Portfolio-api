spring.application.name=Portafolio-Api
server.port=${API_PORT}

app.github.personal=${APP_GITHUB_PERSONAL}
app.github.organizations=${APP_GITHUB_ORGANIZATIONS}
app.github.excluded-repositories=${APP_GITHUB_EXCLUDED_REPOSITORIES:}
app.github.token=${APP_GITHUB_TOKEN}
app.github.base-url=${APP_GITHUB_BASE_URL}

spring.jpa.open-in-view=false

app.reniew.projects.time=${APP_RENIEW_PROJECTS_TIME}
app.reniew.certs.time=${APP_RENIEW_CERTS_TIME}
app.refresh-on-startup=${APP_REFRESH_ON_STARTUP}

app.certificates.base-url=${APP_CERTIFICATES_BASE_URL}
app.redis.certs.time=${APP_REDIS_CERTS_TIME}

app.visits.jwt-secret=${APP_VISITS_JWT_SECRET}
app.visits.jwt-minutes=${APP_VISITS_JWT_MINUTES}
app.visits.trusted-proxies=${APP_VISITS_TRUSTED_PROXIES}
app.host.allowed=${APP_HOST_ALLOWED}

# Candado de origen: secreto que Cloudflare inyecta (Transform Rule) en cada request.
# Sin él (local/tests) el filtro queda desactivado con aviso.
app.origin.secret=${APP_ORIGIN_SECRET:}
app.origin.open-paths=/actuator/health

# Puerta global: auth=true exige JWT + cupos; auth=false deja pasar.
# A�adir un endpoint nuevo = a�adir una regla, sin tocar codigo.
app.gate.rules[0].pattern=/projects/**
app.gate.rules[0].auth=true
app.gate.rules[0].fp-per-minute=120
app.gate.rules[0].ip-per-minute=30
app.gate.rules[1].pattern=/certificates/**
app.gate.rules[1].auth=true
app.gate.rules[1].fp-per-minute=120
app.gate.rules[1].ip-per-minute=30
app.gate.rules[2].pattern=/visits/count
app.gate.rules[2].auth=true
app.gate.rules[2].fp-per-minute=60
app.gate.rules[2].ip-per-minute=60
app.gate.rules[3].pattern=/visits/track
app.gate.rules[3].auth=false
app.gate.rules[4].pattern=/actuator/**
app.gate.rules[4].auth=false

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}/${POSTGRES_DATABASE}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=update
spring.output.ansi.enabled=always
spring.data.redis.host=${REDIS}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
